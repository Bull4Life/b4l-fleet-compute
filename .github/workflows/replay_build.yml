name: replay_build

# Engine's laptop -> fleet offload lane. The laptop pushes an ENCRYPTED job payload to the `kit` branch
# and dispatches this workflow; each slug gets its own runner, pulls its candle from our coordinator,
# builds the marketing bundle and uploads it as an artifact the laptop downloads with `gh run download`.
# No Command Center in the path. See tools/fleet_offload.py in the engine repo for the laptop half.
#
# The repo is public (unlimited free Actions minutes) but carries no readable engine source: kit.enc is
# AES-256 and B4L_KIT_KEY is a repo secret, which GitHub never exposes to fork PRs, and workflow_dispatch
# requires write access. Decryption happens into the runner's own workspace and dies with the job.

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "comma-separated slugs to build (must match the pushed kit)"
        required: true
      kit_ref:
        description: "exact kit commit sha this run is pinned to (branch `kit` is force-pushed per job)"
        required: false
        default: kit

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          slugs = [s for s in os.environ["SLUGS"].replace(" ", "").split(",") if s]
          print("matrix=" + json.dumps({"slug": slugs}))
          PY
        env:
          SLUGS: ${{ inputs.slugs }}

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout payload
        uses: actions/checkout@v4
        with:
          # the exact commit, never the branch: `kit` is force-pushed on every dispatch, so a job that
          # checks out late would otherwise pick up a LATER job's payload
          ref: ${{ inputs.kit_ref }}

      - name: Decrypt kit
        env:
          KIT_KEY: ${{ secrets.B4L_KIT_KEY }}
        run: |
          set -euo pipefail
          test -n "$KIT_KEY" || { echo "::error::B4L_KIT_KEY not set on this repo"; exit 1; }
          mkdir -p engine
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in kit.enc -out kit.tar -pass "pass:$KIT_KEY"
          tar -xf kit.tar -C engine
          rm -f kit.tar kit.enc
          echo "kit files: $(find engine -type f | wc -l)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        # matplotlib is for the chart PNGs. The fleet CAN render them - the earlier "<5 PNGs" bundles
        # were my own doing (builds dispatched without --render), not a runner limitation.
        run: pip install --quiet numpy pandas matplotlib

      - name: Fetch pinned candle
        run: |
          set -euo pipefail
          CANDLE=$(python3 -c "import json;print(json.load(open('MANIFEST.json'))['candles']['${{ matrix.slug }}'])")
          URL=$(python3 -c "import json;print(json.load(open('MANIFEST.json'))['urls']['${{ matrix.slug }}'])")
          test "$CANDLE" != "None" || { echo "::error::no candle mapped for ${{ matrix.slug }}"; exit 1; }
          mkdir -p engine/candles
          echo "pulling $CANDLE from $URL"
          curl -sSfL --retry 3 --retry-delay 5 "$URL" -o "engine/candles/$CANDLE"
          ls -l "engine/candles/$CANDLE"
          # The runner holds EXACTLY ONE candle: the one the diamond's pin names. That is deliberate -
          # the engine falls back to the newest matching file on an exact miss, so a second file here
          # could silently change the backtest window.

      - name: Build bundle
        working-directory: engine
        env:
          # organize_marketing defaults to a 3600 s replay timeout, tuned for the laptop. A 2-core
          # runner is slower, and a 1m slug is ~500k bars: xmr-1m-tight died on TimeoutExpired at
          # exactly that bound (run 35356264973) while xmr-1m-wide finished. The JOB allows 300 min,
          # so the inner timeout was the only thing cutting it short.
          B4L_REPLAY_TIMEOUT: "16000"
        run: |
          set -euo pipefail
          mkdir -p marketing_purpose_strategy_results/marketed
          python tools/organize_marketing.py --only "${{ matrix.slug }}" --render 2>&1 | tee build.log
          # GUARDS. A wrong bundle is worse than a failed job: the first fleet run returned a perfectly
          # plausible 31.3% for xag-3m-tight where the laptop's true answer was 35.3%, purely because the
          # runner resolved a different candle file. The laptop now sends the exact file its own build
          # resolves, so the only things left to assert are that the engine really used it and that the
          # diamond's regime pin was applied - silence on either means the number cannot be trusted.
          # SUCCESS MARKER, printed by both engines.
          grep -q "bundle ready:" build.log || { echo "::error::no bundle produced"; exit 1; }
          # The regime pin line comes from build_wt_replay and therefore exists ONLY on the WaveTrend
          # path. Requiring it unconditionally FAILED ALL FOUR healthy sweep builds on run 35356264973 -
          # the guard could not tell "sweep" from "broken", which is the same defect it exists to catch.
          # Reproduced locally in an isolated kit first: the sweep build succeeds and simply never prints
          # that line. So demand the pin only where it is actually emitted.
          if grep -q "(wt)" build.log; then
            grep -q "\[pin\] regime=" build.log || { echo "::error::WT regime pin never applied"; exit 1; }
          fi
          # `grep -q X && { exit 1; }` would ABORT the step under set -e whenever X is absent (the
          # compound returns 1), i.e. it would fail exactly the healthy case. Use an if.
          if grep -q "replay slow/failed" build.log; then
            echo "::error::replay failed - organize_marketing kept the stale bundle"; exit 1
          fi
          # Engine components that degrade QUIETLY instead of failing. Any of these means the runner
          # computed a different system than the laptop does, so the bundle must not be published.
          # NOTE: "exact end-date miss" is NOT in this list. For 10 of the 24 stale slugs the laptop does
          # not hold the pinned file either and falls back to its newest match; the laptop ships that same
          # file, so the miss is reproduced on purpose and failing on it would block healthy slugs.
          for pat in "\[safety\]\[WARN\]" "import FAILED"; do
            if grep -qE "$pat" build.log; then
              echo "::error::degraded build ($pat) - refusing to publish"; exit 1
            fi
          done
          echo "candle used:"; ls candles

      - name: Collect
        run: |
          set -euo pipefail
          SRC="engine/marketing_purpose_strategy_results/marketed/${{ matrix.slug }}"
          test -s "$SRC/replay.html" || { echo "::error::no replay.html produced"; exit 1; }
          mkdir -p out
          for f in replay.html info.json SUMMARY.md; do
            [ -s "$SRC/$f" ] && cp "$SRC/$f" out/ || true
          done
          # Charts. The manifest holds a slug OUT when it has <5 PNGs, so a bundle that returns without
          # them is silently unpublishable - assert rather than discover it at manifest time.
          if [ -d "$SRC/charts" ]; then cp -r "$SRC/charts" out/; fi
          N=$(find out -name '*.png' | wc -l)
          echo "chart PNGs: $N"
          [ "$N" -ge 5 ] || { echo "::error::only $N chart PNG(s) - the manifest would hold this slug out"; exit 1; }
          # the charts must be PINNED too, or the card contradicts its own replay (measured: 60% vs 49.4%)
          grep -qE "\[pin\] (charts|sweep charts) pinned" build.log || {
            echo "::error::charts rendered WITHOUT a regime pin - they would disagree with the replay"; exit 1; }
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.slug }}
          path: out/
          retention-days: 7
